{% extends 'accounts/base.html' %}
{% block content %}

<div class="max-w-md mx-auto bg-gray-100p-6 rounded shadow">
<h2 class="text-xl font-bold mb-4">Verify OTP</h2>

{% if messages %}
<div class="mb-3">
    {% for message in messages %}
        <div class="p-3 rounded bg-red-100 text-red-700">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input name="otp" placeholder="Enter OTP" class="w-full p-3 border mb-3 text-gray-700">

    <button class="w-full bg-blue-600 text-white p-3">Verify</button>
</form>
{% if user %}
<a href="{% url 'resend_otp' user.id %}">Resend OTP</a>
{% endif %}

<a href="{% url 'resend_otp' user.id %}" class="text-sm text-blue-500">Resend OTP</a>
</div>

{% endblock %}
