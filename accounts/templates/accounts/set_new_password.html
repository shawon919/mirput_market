{% extends 'accounts/base.html' %}
{% block content %}

<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">

            <!-- Header -->
            <div class="bg-[#800000] px-8 py-8 text-center">

                <div class="mx-auto mb-4 w-14 h-14 rounded-full
                            bg-white/10 border border-white/20
                            flex items-center justify-center">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-7 h-7 text-white"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6
                               a2 2 0 00-2-2H6a2 2 0 00-2 2v6
                               a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                        />
                    </svg>

                </div>

                <h2 class="text-3xl font-bold text-white">
                    Set New Password
                </h2>

                <p class="mt-2 text-sm text-white/80">
                    Create a new password for your account
                </p>

            </div>


            <!-- Form -->
            <div class="px-8 py-8">

                <form method="POST" class="space-y-5">

                    {% csrf_token %}


                    <!-- New Password -->
                    <div>

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            New Password
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2
                                         -translate-y-1/2
                                         text-gray-400">

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="w-5 h-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <rect
                                        x="4"
                                        y="10"
                                        width="16"
                                        height="10"
                                        rx="2"
                                    />

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M8 10V7a4 4 0 018 0v3"
                                    />
                                </svg>

                            </span>


                            <input
                                id="newPass"
                                name="password"
                                type="password"
                                placeholder="Enter new password"
                                class="w-full h-12 pl-12 pr-12
                                       rounded-xl
                                       border border-gray-300
                                       bg-gray-50
                                       text-gray-900
                                       placeholder-gray-400
                                       focus:bg-white
                                       focus:outline-none
                                       focus:border-[#800000]
                                       focus:ring-2
                                       focus:ring-[#800000]/20
                                       transition-all duration-200"
                            >


                            <button
                                type="button"
                                onclick="togglePassword('newPass')"
                                class="absolute right-4 top-1/2
                                       -translate-y-1/2
                                       text-gray-400
                                       hover:text-[#800000]
                                       transition"
                            >

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="21"
                                    height="21"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <path
                                        d="M1 12s4-7 11-7
                                           11 7 11 7-4 7-11 7
                                           S1 12 1 12z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />
                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div>

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Confirm Password
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2
                                         -translate-y-1/2
                                         text-gray-400">

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="w-5 h-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <rect
                                        x="4"
                                        y="10"
                                        width="16"
                                        height="10"
                                        rx="2"
                                    />

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M8 10V7a4 4 0 018 0v3"
                                    />
                                </svg>

                            </span>


                            <input
                                id="confirmPass"
                                name="confirm_password"
                                type="password"
                                placeholder="Confirm your password"
                                class="w-full h-12 pl-12 pr-12
                                       rounded-xl
                                       border border-gray-300
                                       bg-gray-50
                                       text-gray-900
                                       placeholder-gray-400
                                       focus:bg-white
                                       focus:outline-none
                                       focus:border-[#800000]
                                       focus:ring-2
                                       focus:ring-[#800000]/20
                                       transition-all duration-200"
                            >


                            <button
                                type="button"
                                onclick="togglePassword('confirmPass')"
                                class="absolute right-4 top-1/2
                                       -translate-y-1/2
                                       text-gray-400
                                       hover:text-[#800000]
                                       transition"
                            >

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="21"
                                    height="21"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <path
                                        d="M1 12s4-7 11-7
                                           11 7 11 7-4 7-11 7
                                           S1 12 1 12z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />
                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- Reset Password -->
                    <button
                        type="submit"
                        class="w-full h-12
                               bg-[#800000]
                               hover:bg-[#5C0000]
                               active:bg-[#4A0000]
                               text-white
                               rounded-xl
                               font-semibold
                               shadow-md
                               hover:shadow-lg
                               transition-all duration-200"
                    >
                        Reset Password
                    </button>

                </form>


                <!-- Back to Login -->
                <div class="mt-7 pt-6 border-t border-gray-100 text-center">

                    <p class="text-sm text-gray-500">

                        Remember your password?

                        <a
                            href="{% url 'login' %}"
                            class="ml-1 font-semibold
                                   text-[#800000]
                                   hover:text-[#5C0000]
                                   transition"
                        >
                            Back to Login
                        </a>

                    </p>

                </div>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Secure password recovery
        </p>

    </div>

</div>


<script>

function togglePassword(fieldId) {

    const input = document.getElementById(fieldId);

    input.type =
        (input.type === "password")
            ? "text"
            : "password";
}

</script>

{% endblock %}
