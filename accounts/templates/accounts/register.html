
<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

    <!-- Register Card -->
    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">

            <!-- Header -->
            <div class="bg-[#800000] px-8 py-8 text-center">

                <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-white/10
                            border border-white/20 flex items-center justify-center">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-7 h-7 text-white"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M18 9v3m0 0v3m0-3h3m-3 0h-3
                                 M15 21a6 6 0 00-12 0
                                 M9 11a4 4 0 100-8 4 4 0 000 8z"/>

                    </svg>

                </div>

                <h2 class="text-3xl font-bold text-white">
                    Create Account
                </h2>

                <p class="mt-2 text-sm text-white/80">
                    Register your account to get started
                </p>

            </div>


            <!-- Form Area -->
            <div class="px-8 py-8">

                <form method="POST" class="space-y-5">

                    {% csrf_token %}


                    <!-- Username -->
                    <div>

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Username
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="w-5 h-5"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="1.8">

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M15.75 6a3.75 3.75 0 11-7.5 0
                                             3.75 3.75 0 017.5 0z
                                             M4.5 20.25a7.5 7.5 0 0115 0"/>

                                </svg>

                            </span>

                            <input
                                name="username"
                                placeholder="Enter your username"
                                class="w-full h-12 pl-12 pr-4 rounded-xl
                                       border border-gray-300
                                       bg-gray-50 text-gray-900
                                       placeholder-gray-400
                                       focus:bg-white
                                       focus:outline-none
                                       focus:border-[#800000]
                                       focus:ring-2 focus:ring-[#800000]/20
                                       transition"
                            >

                        </div>

                    </div>


                    <!-- Email -->
                    <div>

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Email Address
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="w-5 h-5"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="1.8">

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M3 8l9 6 9-6
                                             M5 19h14a2 2 0 002-2V7
                                             a2 2 0 00-2-2H5
                                             a2 2 0 00-2 2v10
                                             a2 2 0 002 2z"/>

                                </svg>

                            </span>

                            <input
                                name="email"
                                type="email"
                                placeholder="Enter your email"
                                class="w-full h-12 pl-12 pr-4 rounded-xl
                                       border border-gray-300
                                       bg-gray-50 text-gray-900
                                       placeholder-gray-400
                                       focus:bg-white
                                       focus:outline-none
                                       focus:border-[#800000]
                                       focus:ring-2 focus:ring-[#800000]/20
                                       transition"
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div>

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Password
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="w-5 h-5"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="1.8">

                                    <rect x="4" y="10" width="16" height="10"
                                          rx="2"/>

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M8 10V7a4 4 0 018 0v3"/>

                                </svg>

                            </span>


                            <input
                                id="regPassword"
                                name="password"
                                type="password"
                                placeholder="Enter your password"
                                class="w-full h-12 pl-12 pr-12 rounded-xl
                                       border border-gray-300
                                       bg-gray-50 text-gray-900
                                       placeholder-gray-400
                                       focus:bg-white
                                       focus:outline-none
                                       focus:border-[#800000]
                                       focus:ring-2 focus:ring-[#800000]/20
                                       transition"
                            >


                            <!-- Password Toggle -->
                            <button
                                type="button"
                                onclick="togglePassword('regPassword')"
                                class="absolute right-4 top-1/2
                                       -translate-y-1/2
                                       text-gray-400
                                       hover:text-[#800000]
                                       transition"
                            >

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="21"
                                     height="21"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8">

                                    <path
                                        d="M1 12s4-7 11-7
                                           11 7 11 7-4 7-11 7
                                           S1 12 1 12z"/>

                                    <circle cx="12"
                                            cy="12"
                                            r="3"/>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="w-full h-12 mt-2
                               bg-[#800000]
                               hover:bg-[#5C0000]
                               active:bg-[#4A0000]
                               text-white
                               rounded-xl
                               font-semibold
                               shadow-md
                               hover:shadow-lg
                               transition-all duration-200"
                    >
                        Create Account
                    </button>

                </form>


                <!-- Django Messages -->
                {% if messages %}

                <div class="mt-6 space-y-3">

                    {% for message in messages %}

                        {% if request.resolver_match.url_name == 'register' %}

                        <div class="flex items-start gap-3
                                    p-4 rounded-xl
                                    bg-red-50
                                    border border-red-200
                                    text-red-700
                                    text-sm">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-5 h-5 flex-shrink-0 mt-0.5"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 9v3.75m0 3h.008
                                         M10.29 3.86L1.82 18
                                         a2 2 0 001.71 3h16.94
                                         a2 2 0 001.71-3L13.71 3.86
                                         a2 2 0 00-3.42 0z"/>

                            </svg>

                            <span>
                                {{ message }}
                            </span>

                        </div>

                        {% endif %}

                    {% endfor %}

                </div>

                {% endif %}


                <!-- Login -->
                <div class="mt-7 text-center">

                    <p class="text-sm text-gray-500">

                        Already have an account?

                        <a
                            href="{% url 'login' %}"
                            class="ml-1 font-semibold
                                   text-[#800000]
                                   hover:text-[#5C0000]
                                   transition"
                        >
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>


        <!-- Bottom Text -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Secure account registration
        </p>

    </div>

</div>


<script>
function togglePassword(fieldId) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
```
