<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Realtime Chat</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       COLOR SYSTEM
    ========================================= */

    :root {
      --white: #FFFFFF;
      --maroon: #800000;
      --dark-maroon: #5C0000;

      --page-bg: #FFFFFF;
      --surface: #FFFFFF;
      --surface-soft: #FFFFFF;

      --text: #5C0000;
      --muted: #800000;

      --border: #800000;

      --bubble-me: #800000;
      --bubble-them: #FFFFFF;

      --shadow:
        0 12px 35px rgba(128, 0, 0, 0.12);

      --shadow-small:
        0 4px 15px rgba(128, 0, 0, 0.10);
    }


    /* =========================================
       GLOBAL
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;

      background: var(--page-bg);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 18px;
    }


    /* =========================================
       CHAT CONTAINER
    ========================================= */

    .chat {
      width: min(760px, 100%);
      height: 94dvh;

      background: var(--surface);

      border: 1px solid var(--maroon);
      border-radius: 22px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow: var(--shadow);
    }


    /* =========================================
       HEADER
    ========================================= */

    .chat-header {
      display: flex;
      align-items: center;
      gap: 13px;

      padding: 15px 18px;

      background: var(--maroon);

      border-bottom: 1px solid var(--dark-maroon);

      flex-shrink: 0;
    }


    /* =========================================
       AVATAR
    ========================================= */

    .avatar {
      width: 44px;
      height: 44px;

      padding: 2px;

      background: var(--white);

      border-radius: 50%;

      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      display: block;

      border-radius: 50%;

      object-fit: cover;
    }


    /* =========================================
       USER INFORMATION
    ========================================= */

    .who {
      flex: 1;
      min-width: 0;
    }

    .name {
      color: var(--white);

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 3px;

      color: var(--white);

      font-size: 11px;
      font-weight: 500;

      opacity: 0.9;
    }


    /* =========================================
       HEADER BUTTONS
    ========================================= */

    .icon-btn {
      width: 40px;
      height: 40px;

      border: 1px solid transparent;
      border-radius: 10px;

      background: transparent;

      display: grid;
      place-items: center;

      color: var(--white);

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;

      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--white);

      color: var(--maroon);

      border-color: var(--white);

      transform: translateY(-1px);
    }


    /* =========================================
       MESSAGES AREA
    ========================================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 22px 20px;

      display: flex;
      flex-direction: column;

      gap: 14px;

      background: var(--white);
    }


    /* =========================================
       SCROLLBAR
    ========================================= */

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--white);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--maroon);

      border-radius: 999px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: var(--dark-maroon);
    }


    /* =========================================
       DAY DIVIDER
    ========================================= */

    .day-divider {
      align-self: center;

      padding: 6px 13px;

      border: 1px solid var(--maroon);
      border-radius: 999px;

      background: var(--white);

      color: var(--maroon);

      font-size: 11px;
      font-weight: 600;

      box-shadow: var(--shadow-small);
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .msg {
      display: flex;
      align-items: flex-end;

      gap: 8px;

      max-width: 76%;
    }

    .msg.them {
      align-self: flex-start;
    }

    .msg.me {
      align-self: flex-end;

      flex-direction: row-reverse;
    }


    /* =========================================
       MESSAGE AVATAR
    ========================================= */

    .msg img.av {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      object-fit: cover;

      border: 1px solid var(--maroon);

      flex-shrink: 0;
    }


    /* =========================================
       MESSAGE CONTENT
    ========================================= */

    .bubble {
      padding: 11px 14px;

      border-radius: 17px;

      font-size: 14px;
      line-height: 1.5;

      word-wrap: break-word;

      box-shadow: var(--shadow-small);
    }


    /* OTHER USER */
    .msg.them .bubble {
      background: var(--white);

      color: var(--dark-maroon);

      border: 1px solid var(--maroon);

      border-bottom-left-radius: 5px;
    }


    /* CURRENT USER */
    .msg.me .bubble {
      background: var(--maroon);

      color: var(--white);

      border: 1px solid var(--maroon);

      border-bottom-right-radius: 5px;
    }


    /* =========================================
       MESSAGE TIME
    ========================================= */

    .meta {
      margin-top: 5px;

      color: var(--maroon);

      font-size: 10px;
      font-weight: 500;
    }

    .msg.me .meta {
      text-align: right;
    }


    /* =========================================
       COMPOSER
    ========================================= */

    .composer {
      padding: 13px 16px;

      background: var(--white);

      border-top: 1px solid var(--maroon);

      flex-shrink: 0;
    }


    .composer-inner {
      display: flex;
      align-items: flex-end;

      gap: 7px;

      padding: 7px 8px;

      background: var(--white);

      border: 1px solid var(--maroon);

      border-radius: 17px;

      transition:
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .composer-inner:focus-within {
      border-color: var(--dark-maroon);

      box-shadow:
        0 0 0 3px rgba(128, 0, 0, 0.08);
    }


    /* =========================================
       TEXTAREA
    ========================================= */

    textarea {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      resize: none;

      background: transparent;

      color: var(--dark-maroon);

      max-height: 140px;

      font-size: 14px;
      font-family: inherit;
      line-height: 1.45;

      padding: 8px 5px;
    }

    textarea::placeholder {
      color: var(--maroon);

      opacity: 0.7;
    }


    /* =========================================
       COMPOSER ICON
    ========================================= */

    .composer .icon-btn {
      color: var(--maroon);

      width: 40px;
      height: 40px;
    }

    .composer .icon-btn:hover {
      background: var(--maroon);

      color: var(--white);

      border-color: var(--maroon);
    }


    /* =========================================
       SEND BUTTON
    ========================================= */

    .send-btn {
      width: 42px;
      height: 42px;

      border: 1px solid var(--maroon);
      border-radius: 12px;

      background: var(--maroon);

      color: var(--white);

      display: grid;
      place-items: center;

      cursor: pointer;

      flex-shrink: 0;

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .send-btn:hover {
      background: var(--dark-maroon);

      border-color: var(--dark-maroon);

      transform: translateY(-1px);
    }

    .send-btn:active {
      transform: scale(0.96);
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 1024px) {

      body {
        padding: 10px;
      }

      .chat {
        width: 90%;
        height: 96dvh;
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 768px) {

      body {
        padding: 0;

        align-items: stretch;
        justify-content: stretch;

        background: var(--white);
      }

      .chat {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;

        border-radius: 0;

        border: none;

        box-shadow: none;
      }

      .chat-header {
        padding: 12px 14px;

        gap: 10px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .name {
        font-size: 14px;
      }

      .status {
        font-size: 10px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;

        border-radius: 9px;
      }

      .messages {
        padding: 14px 12px;

        gap: 10px;
      }

      .msg {
        max-width: 92%;

        gap: 6px;
      }

      .msg img.av {
        width: 28px;
        height: 28px;
      }

      .bubble {
        padding: 9px 12px;

        font-size: 13px;

        line-height: 1.45;

        border-radius: 15px;
      }

      .meta {
        font-size: 9px;
      }

      .composer {
        padding: 9px;
      }

      .composer-inner {
        gap: 5px;

        padding: 6px 7px;

        border-radius: 15px;
      }

      textarea {
        font-size: 13px;

        max-height: 120px;
      }

      .send-btn {
        width: 40px;
        height: 40px;

        border-radius: 11px;
      }

    }


    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (max-width: 480px) {

      .chat-header {
        padding: 10px 11px;
      }

      .avatar {
        width: 36px;
        height: 36px;
      }

      .name {
        font-size: 13px;
      }

      .status {
        font-size: 9px;
      }

      .messages {
        padding: 10px;
      }

      .msg {
        max-width: 95%;
      }

      .bubble {
        font-size: 12px;

        padding: 8px 10px;
      }

      .composer {
        padding: 7px;
      }

      .composer-inner {
        padding: 5px;

        border-radius: 13px;
      }

      textarea {
        font-size: 12px;
      }

      .send-btn {
        width: 38px;
        height: 38px;
      }

      .composer .icon-btn {
        width: 36px;
        height: 36px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 360px) {

      .chat-header {
        gap: 8px;
      }

      .avatar {
        width: 34px;
        height: 34px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
      }

      .msg {
        max-width: 97%;
      }

      .messages {
        padding: 8px;
      }

    }

  </style>
</head>

<body>

  <section class="chat">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="chat-header">

      <div class="avatar">

        <img
          src="https://i.pravatar.cc/80?img=47"
          alt="User"
        >

      </div>


      <div class="who">

        <div class="name">
          {{ other_user.username }}
        </div>

        <div class="status">

          <i
            class="bi bi-circle-fill"
            style="font-size:.45rem"
          ></i>

          Active now

        </div>

      </div>


      <button
        type="button"
        class="icon-btn"
        aria-label="Call"
      >
        <i class="bi bi-telephone"></i>
      </button>


      <button
        type="button"
        class="icon-btn"
        aria-label="Video call"
      >
        <i class="bi bi-camera-video"></i>
      </button>

    </header>


    <!-- =========================
         MESSAGES
    ========================== -->

    <div
      class="messages"
      id="messages"
    >

      <div class="day-divider">
        Today
      </div>

    </div>


    <!-- =========================
         MESSAGE COMPOSER
    ========================== -->

    <form
      class="composer"
      id="composer"
    >

      <div class="composer-inner">

        <button
          type="button"
          class="icon-btn"
          aria-label="Attach file"
        >
          <i class="bi bi-paperclip"></i>
        </button>


        <textarea
          id="input"
          rows="1"
          placeholder="Write a message..."
        ></textarea>


        <button
          type="submit"
          class="send-btn"
          aria-label="Send message"
        >
          <i class="bi bi-send-fill"></i>
        </button>

      </div>

    </form>

  </section>


  <script>

    const receiverId = "{{ id }}";
    const currentUserId = "{{ request.user.id }}";

    const wsScheme =
      window.location.protocol === "https:" ? "wss" : "ws";

    const socket = new WebSocket(
      wsScheme +
      "://" +
      window.location.host +
      "/ws/chat/" +
      receiverId +
      "/"
    );

    const messages = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");


    // ======================
    // SOCKET CONNECT
    // ======================

    socket.onopen = function () {

      console.log("Connected");

    };


    // ======================
    // RECEIVE MESSAGE
    // ======================

    socket.onmessage = function (e) {

      const data = JSON.parse(e.data);

      console.log(data);


      // HISTORY

      if (data.message_history) {

        data.message_history.forEach(msg => {

          renderMessage(
            msg.message,
            msg.timestamp,
            String(msg.sender_id) === String(currentUserId)
          );

        });

        scrollBottom();

        return;
      }


      // LIVE MESSAGE

      renderMessage(
        data.message,
        data.timestamp,
        String(data.sender_id) === String(currentUserId)
      );

      scrollBottom();

    };


    // ======================
    // RENDER MESSAGE
    // ======================

    function renderMessage(
      message,
      timestamp,
      isMe
    ) {

      const messageHTML = `

        <div class="msg ${isMe ? 'me' : 'them'}">

          ${!isMe ? `

            <img
              class="av"
              src="https://i.pravatar.cc/60?img=47"
              alt="User"
            >

          ` : ''}


          <div>

            <div class="bubble">

              ${escapeHTML(message)}

            </div>


            <div class="meta">

              ${timestamp}

            </div>

          </div>

        </div>

      `;


      messages.insertAdjacentHTML(
        "beforeend",
        messageHTML
      );

    }


    // ======================
    // SEND MESSAGE
    // ======================

    composer.addEventListener(
      "submit",
      function (e) {

        e.preventDefault();

        const message =
          input.value.trim();

        if (!message) return;


        socket.send(
          JSON.stringify({
            message: message
          })
        );


        input.value = "";

        input.style.height = "auto";

      }
    );


    // ======================
    // AUTO RESIZE TEXTAREA
    // ======================

    input.addEventListener(
      "input",
      () => {

        input.style.height = "auto";

        input.style.height =
          Math.min(
            input.scrollHeight,
            140
          ) + "px";

      }
    );


    // ======================
    // HELPERS
    // ======================

    function scrollBottom() {

      messages.scrollTop =
        messages.scrollHeight;

    }


    function escapeHTML(str) {

      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ======================
    // SOCKET CLOSE
    // ======================

    socket.onclose = function () {

      console.log("Disconnected");

    };

  </script>

</body>
</html>
